<style>
*{font-family:'Outfit',system-ui,sans-serif;box-sizing:border-box}
h1,h2,h3,.font-display{font-family:'Playfair Display',Georgia,serif}
body{background:#f7f8fa;color:#1a2030;transition:background .3s,color .3s}
/* ===== COMPREHENSIVE DARK MODE ===== */
.dark body,.dark{background:#0f1520;color:#c7d0da}
.dark ::-webkit-scrollbar-thumb{background:#364152}
/* --- Tailwind ink text overrides: dark text → light text --- */
.dark [class*="text-ink-900"],.dark [class*="text-ink-800"],.dark [class*="text-ink-700"]{color:#e3e8ed!important}
.dark [class*="text-ink-600"],.dark [class*="text-ink-500"]{color:#c7d0da!important}
.dark [class*="text-ink-400"]{color:#9ba8b8!important}
.dark [class*="text-ink-300"]{color:#6f7f93!important}
.dark [class*="text-ink-100"],.dark [class*="text-ink-200"]{color:#9ba8b8!important}
/* --- Headings & display text --- */
.dark h1,.dark h2,.dark h3,.dark h4,.dark .font-display{color:#e3e8ed}
/* --- Cards, panels, surfaces --- */
.dark .card{background:#1a2030;border-color:#283040;color:#c7d0da}
.dark .card:hover{box-shadow:0 4px 24px rgba(0,0,0,.25)}
.dark .notif-panel{background:#1a2030;border-color:#283040;box-shadow:0 12px 40px rgba(0,0,0,.4)}
/* --- Sidebar --- */
.dark .sidebar-link{color:#9ba8b8}
.dark .sidebar-link:hover{background:rgba(29,148,104,.12);color:#6bcba8}
.dark .sidebar-link.active{background:rgba(29,148,104,.2);color:#3bb285}
/* --- Kudos & reactions --- */
.dark .kudos-card{background:linear-gradient(135deg,rgba(29,148,104,.08),#1a2030);border-color:#283040}
.dark .reaction-btn{background:#283040;border-color:#364152;color:#9ba8b8}
.dark .reaction-btn:hover,.dark .reaction-btn.active{background:rgba(29,148,104,.2);border-color:#1d9468}
/* --- Forms --- */
.dark input,.dark select,.dark textarea{background:#151d2b;border-color:#364152;color:#e3e8ed}
.dark input::placeholder,.dark textarea::placeholder{color:#6f7f93}
/* --- Tables --- */
.dark table{color:#c7d0da}
.dark td,.dark th{color:#c7d0da}
.dark td .font-medium,.dark td span{color:inherit}
.dark tr{border-color:#283040!important}
.dark thead th{color:#9ba8b8!important}
.dark tbody td{color:#c7d0da}
/* --- Badges: VIBRANT in dark mode (strong bg + bright text) --- */
.dark .badge{opacity:1;font-weight:700}
/* Badge backgrounds — richer, more saturated */
.dark .badge[class*="bg-brand-100"]{background:rgba(29,148,104,.28)!important;color:#5fd6aa!important}
.dark .badge[class*="bg-blue-100"]{background:rgba(59,130,246,.28)!important;color:#7cb4ff!important}
.dark .badge[class*="bg-amber-100"]{background:rgba(245,158,11,.28)!important;color:#fcc94d!important}
.dark .badge[class*="bg-red-100"]{background:rgba(239,68,68,.28)!important;color:#ff8f8f!important}
.dark .badge[class*="bg-purple-100"]{background:rgba(139,92,246,.3)!important;color:#bda4ff!important}
.dark .badge[class*="bg-sky-100"]{background:rgba(14,165,233,.28)!important;color:#5cc8ff!important}
.dark .badge[class*="bg-green-100"]{background:rgba(34,197,94,.28)!important;color:#5fe08a!important}
.dark .badge[class*="bg-ink-100"]{background:rgba(155,168,184,.2)!important;color:#cdd6e0!important}
/* Non-badge tinted backgrounds (cards, banners) */
.dark [class*="bg-brand-100"]:not(.badge){background:rgba(29,148,104,.18)!important}
.dark [class*="bg-blue-100"]:not(.badge){background:rgba(59,130,246,.18)!important}
.dark [class*="bg-amber-100"]:not(.badge){background:rgba(245,158,11,.18)!important}
.dark [class*="bg-red-100"]:not(.badge){background:rgba(239,68,68,.18)!important}
.dark [class*="bg-purple-100"]:not(.badge){background:rgba(139,92,246,.18)!important}
.dark [class*="bg-sky-100"]:not(.badge){background:rgba(14,165,233,.18)!important}
.dark [class*="bg-green-100"]:not(.badge){background:rgba(34,197,94,.18)!important}
/* --- Light bg sections → dark alternatives --- */
.dark [class*="bg-brand-50"]{background:rgba(29,148,104,.08)!important}
.dark [class*="bg-blue-50"]{background:rgba(59,130,246,.08)!important}
.dark [class*="bg-amber-50"]{background:rgba(245,158,11,.08)!important}
.dark [class*="bg-red-50"]{background:rgba(239,68,68,.08)!important}
.dark [class*="bg-purple-50"]{background:rgba(139,92,246,.08)!important}
.dark [class*="bg-ink-50"]{background:rgba(200,210,220,.05)!important}
/* --- Borders --- */
.dark [class*="border-ink-100"],.dark [class*="border-ink-50"]{border-color:#283040!important}
.dark [class*="border-ink-200"]{border-color:#364152!important}
.dark [class*="border-brand-200"]{border-color:rgba(29,148,104,.3)!important}
.dark [class*="border-blue-200"]{border-color:rgba(59,130,246,.3)!important}
.dark [class*="border-amber-200"]{border-color:rgba(245,158,11,.3)!important}
/* --- Colored text that needs boosting in dark (brighter, more vibrant) --- */
.dark [class*="text-brand-600"],.dark [class*="text-brand-700"],.dark [class*="text-brand-800"]{color:#4fd19f!important}
.dark [class*="text-blue-600"],.dark [class*="text-blue-700"],.dark [class*="text-blue-800"]{color:#6ba8ff!important}
.dark [class*="text-amber-600"],.dark [class*="text-amber-700"],.dark [class*="text-amber-800"]{color:#fcc135!important}
.dark [class*="text-red-500"],.dark [class*="text-red-600"]{color:#ff7a7a!important}
.dark [class*="text-purple-600"],.dark [class*="text-purple-700"]{color:#b399ff!important}
.dark [class*="text-sky-600"],.dark [class*="text-sky-700"]{color:#4fc3ff!important}
/* --- Misc components --- */
.dark .comp-bar{background:#283040}
.dark .nine-cell{border-color:#364152;background:rgba(255,255,255,.03)}
.dark .metric-card::before{opacity:.15}
.dark .review-q{border-left-color:#3bb285}
.dark .accordion-body{color:#9ba8b8}
.dark .step-line::before{background:#364152}
/* ===== END DARK MODE ===== */
.dm-toggle{position:relative;display:flex;height:36px;width:36px;align-items:center;justify-content:center;border-radius:9999px;cursor:pointer;border:none;background:transparent;overflow:hidden;transition:opacity .2s,background .2s;flex-shrink:0;color:#4a5768}
.dm-toggle:hover{opacity:.8;background:rgba(0,0,0,.04)}
.dark .dm-toggle{color:#c7d0da}
.dark .dm-toggle:hover{background:rgba(255,255,255,.06)}
.dm-toggle svg{position:absolute;width:20px;height:20px;transition:all .3s cubic-bezier(0.34,1.56,0.64,1)}
.dm-icon-sun{transform:scale(1) translateY(0);opacity:1}
.dm-icon-moon{transform:scale(.5) translateY(20px);opacity:0}
.dark .dm-icon-sun{transform:scale(.5) translateY(20px);opacity:0}
.dark .dm-icon-moon{transform:scale(1) translateY(0);opacity:1}
/* Dark: buttons, hovers, overlays */
.dark button:not([class*="bg-brand"]):not([class*="bg-blue"]):not([class*="bg-amber"]):not([class*="bg-red"]):not([class*="bg-ink-7"]):not([class*="bg-purple"]):not(.dm-toggle):not(.sidebar-link):not(.pulse-emoji):not(.reaction-btn){color:#c7d0da}
.dark [class*="hover\:bg-ink-50"]:hover{background:rgba(200,210,220,.06)!important}
.dark [class*="bg-white"]{background:#1a2030!important}
.dark [class*="bg-white\/"],.dark [class*="bg-white\/"]{background:rgba(26,32,48,.8)!important}
.dark .notif-panel button:hover{background:rgba(200,210,220,.06)}
.dark .nine-cell [class*="bg-brand-50"],.dark .nine-cell [class*="bg-blue-50"],.dark .nine-cell [class*="bg-amber-50"],.dark .nine-cell [class*="bg-red-50"]{background:transparent!important}
.dark [class*="bg-gradient-to-r"][class*="from-ink-800"]{background:linear-gradient(to right,#151d2b,#1a2030)!important}
.dark [class*="shadow-brand"]{--tw-shadow-color:rgba(29,148,104,.15)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#c7d0da;border-radius:9px}
.fade-in{animation:fadeIn .45s cubic-bezier(.22,1,.36,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.toast-in{animation:toastSlide .35s ease,toastOut .3s ease 2.5s forwards}
@keyframes toastSlide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}
.card{background:#fff;border-radius:14px;border:1px solid #e3e8ed;padding:1.25rem;transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 24px rgba(0,0,0,.06)}
.sidebar-link{transition:all .15s;border-radius:10px;padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:.875rem;color:#4a5768;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.sidebar-link:hover{background:#f0faf6;color:#177853}
.sidebar-link.active{background:#d0f0e4;color:#125e41;font-weight:600}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 2.5px rgba(29,148,104,.35)}
.progress-ring{transform:rotate(-90deg)}
.metric-card{position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;opacity:.08}
.metric-card.green::before{background:#1d9468}.metric-card.blue::before{background:#3b82f6}.metric-card.amber::before{background:#f59e0b}.metric-card.purple::before{background:#8b5cf6}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:.7rem;font-weight:600;letter-spacing:.02em}
/* === Aurora animated login background === */
/* === Subtle grid pattern login background === */
.login-bg{position:relative;background:#0a0e1a;overflow:hidden}
.login-bg .grid-pattern{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 40px),
    repeating-linear-gradient(45deg, rgba(0,255,128,0.04) 0, rgba(0,255,128,0.04) 1px, transparent 1px, transparent 20px),
    repeating-linear-gradient(-45deg, rgba(29,148,104,0.05) 0, rgba(29,148,104,0.05) 1px, transparent 1px, transparent 30px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 80px),
    radial-gradient(circle at 60% 40%, rgba(29,148,104,0.07) 0, transparent 60%);
  background-size: 80px 80px, 40px 40px, 60px 60px, 80px 80px, 100% 100%;
  background-position: 0 0, 0 0, 0 0, 40px 40px, center;
}
.login-bg .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 0%,rgba(5,8,16,.35) 70%,rgba(5,8,16,.7) 100%)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.22,1,.36,1)}
.accordion-body.open{max-height:800px}
/* Bulletproof toggle: Tailwind .flex ties .hidden on specificity and wins by
   source order, leaving display:flex. Force display:none only on the two
   top-level view containers so the login/app swap is reliable. */
#loginView.hidden,#app.hidden{display:none!important}
@media(max-width:1023px){#sidebar{transform:translateX(-100%);position:fixed;z-index:50;top:0;bottom:0;left:0}#sidebar.open{transform:translateX(0)}}
/* === Collapsible sidebar (desktop, Claude-style) === */
#sidebar{transition:width .28s cubic-bezier(.4,0,.2,1),transform .28s cubic-bezier(.4,0,.2,1)}
/* Collapse button — bigger, more visible, brand-colored on hover */
.sb-collapse-btn{
  position:absolute;top:64px;right:-14px;
  width:28px;height:28px;border-radius:50%;
  background:#fff;border:1px solid #d4dae3;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:60;
  box-shadow:0 2px 8px rgba(0,0,0,.08), 0 0 0 4px #f7f8fa;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .2s, border-color .2s, box-shadow .2s, color .2s;
  color:#4a5768;
}
.sb-collapse-btn:hover{
  background:#1d9468;border-color:#1d9468;color:#fff;
  transform:scale(1.12);
  box-shadow:0 3px 12px rgba(29,148,104,.4), 0 0 0 4px #f7f8fa;
}
.sb-collapse-btn:active{transform:scale(.95)}
.dark .sb-collapse-btn{
  background:#1a2030;border-color:#364152;color:#9ba8b8;
  box-shadow:0 2px 8px rgba(0,0,0,.3), 0 0 0 4px #0f1520;
}
.dark .sb-collapse-btn:hover{
  background:#1d9468;border-color:#1d9468;color:#fff;
  box-shadow:0 3px 12px rgba(29,148,104,.5), 0 0 0 4px #0f1520;
}
.sb-collapse-btn svg{transition:transform .35s cubic-bezier(.34,1.56,.64,1);width:14px;height:14px;stroke-width:2.5}

@media(min-width:1024px){
  /* Explicit desktop sidebar positioning — do NOT rely on Tailwind lg:fixed/h-screen,
     which the Play CDN does not reliably generate. */
  #sidebar{position:fixed!important;top:0;left:0;height:100vh!important;overflow:hidden;width:260px!important;transform:none!important;z-index:40}
  /* Expanded (default): force our own margin so collapse can override it cleanly */
  .sb-main{margin-left:260px!important;transition:margin-left .3s cubic-bezier(.4,0,.2,1)}
  body.sb-collapsed #sidebar{width:74px!important}
  body.sb-collapsed .sb-main{margin-left:74px!important}
  body.sb-collapsed .sb-collapse-btn svg{transform:rotate(180deg)}
  body.sb-collapsed .sidebar-link{justify-content:center;padding:9px}
  body.sb-collapsed #sidebar .p-5{padding:1.1rem 0;justify-content:center}
  body.sb-collapsed #sidebar .p-4{padding:.75rem .5rem}
  body.sb-collapsed .sb-user-row{justify-content:center}
  body.sb-collapsed .sb-logout{padding:.5rem}

  /* Labels: opacity-only, no width animation = no reflow = no stutter
     Default state (expanded): fade-in delayed until sidebar width finishes
     Collapsed state: fade-out immediately (delay 0) so labels disappear before clip */
  .sb-label, .sb-brand-text, .sb-user-text, #roleSelect{
    white-space:nowrap;
    transition:opacity .18s ease-out .22s;
  }
  body.sb-collapsed .sb-label,
  body.sb-collapsed .sb-brand-text,
  body.sb-collapsed .sb-user-text,
  body.sb-collapsed #roleSelect{
    opacity:0;
    pointer-events:none;
    transition:opacity .12s ease-out 0s;
  }

  /* Tooltip on hover when collapsed */
  body.sb-collapsed .sidebar-link{position:relative}
  body.sb-collapsed .sidebar-link:hover::after{
    content:attr(data-label);position:absolute;left:calc(100% + 14px);top:50%;
    transform:translateY(-50%);background:#1a2030;color:#fff;
    padding:6px 11px;border-radius:7px;font-size:.72rem;font-weight:600;
    white-space:nowrap;z-index:70;box-shadow:0 4px 14px rgba(0,0,0,.25);
    pointer-events:none;animation:tooltipIn .15s ease-out;
  }
  .dark body.sb-collapsed .sidebar-link:hover::after{background:#283040}
  @keyframes tooltipIn{from{opacity:0;transform:translate(-4px,-50%)}to{opacity:1;transform:translateY(-50%)}}
}
.notif-panel{position:absolute;right:0;top:100%;margin-top:8px;width:360px;max-height:440px;overflow-y:auto;background:#fff;border:1px solid #e3e8ed;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.12);z-index:100;display:none}
.notif-panel.open{display:block}
.kudos-card{background:linear-gradient(135deg,#f0faf6,#fff);border:1px solid #d0f0e4}
.reaction-btn{padding:2px 8px;border-radius:99px;font-size:.75rem;border:1px solid #e3e8ed;cursor:pointer;transition:all .15s;background:#fff}
.reaction-btn:hover,.reaction-btn.active{background:#d0f0e4;border-color:#6bcba8}
.step-line{position:relative}.step-line::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:#e3e8ed}
.step-line:last-child::before{display:none}
.review-q{border-left:3px solid #1d9468;padding-left:12px;margin-bottom:12px}
.nine-box{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;aspect-ratio:1;max-width:560px}
.nine-cell{border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer;transition:all .2s;border:1px solid transparent;min-height:100px}
.nine-cell:hover{border-color:#1d9468;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.nine-cell .emp-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff;flex-shrink:0}
.comp-bar{height:8px;border-radius:4px;position:relative;overflow:hidden;background:#e3e8ed}
.comp-bar-fill{height:100%;border-radius:4px;transition:width .4s}
.pulse-emoji{font-size:1.5rem;cursor:pointer;opacity:.5;transition:all .15s;padding:4px}
.pulse-emoji:hover,.pulse-emoji.sel{opacity:1;transform:scale(1.25)}
.enps-bar{height:32px;border-radius:8px;display:flex;overflow:hidden}
/* Mizan Logo Animations */
.logo-mark{position:relative;overflow:hidden}
.logo-mark::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent 0%,rgba(255,255,255,.28) 10%,transparent 20%);animation:logoShimmer 3.2s ease-in-out infinite;pointer-events:none}
@keyframes logoShimmer{0%,100%{transform:rotate(0deg)}50%{transform:rotate(360deg)}}
/* Animated balance scale (Mizan = balance) */
.scale-svg{width:100%;height:100%;overflow:visible}
.scale-beam{transform-origin:50% 30%;animation:beamTilt 4.5s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes beamTilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.scale-pan-l,.scale-string-l{transform-origin:center top;animation:panL 4.5s cubic-bezier(.45,.05,.55,.95) infinite}
.scale-pan-r,.scale-string-r{transform-origin:center top;animation:panR 4.5s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes panL{0%,100%{transform:translateY(3.5px)}50%{transform:translateY(-3.5px)}}
@keyframes panR{0%,100%{transform:translateY(-3.5px)}50%{transform:translateY(3.5px)}}
.logo-text{background:linear-gradient(135deg,#e59563,#d97a45);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dark .logo-text{background:linear-gradient(135deg,#eeb38a,#e59563);-webkit-background-clip:text;background-clip:text}
.login-logo{animation:logoEntrance .9s cubic-bezier(.22,1,.36,1) both;animation-delay:.12s}
@keyframes logoEntrance{from{opacity:0;transform:scale(.65) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.login-title{animation:titleSlide .6s cubic-bezier(.22,1,.36,1) both;animation-delay:.35s}
@keyframes titleSlide{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.sidebar-logo-hover:hover .scale-beam{animation-duration:2.2s}
</style>

<body>
<div id="toasts" class="fixed top-5 right-5 z-[999] flex flex-col gap-2 pointer-events-none"></div>

<!-- LOGIN -->
<div id="loginView" class="login-bg min-h-screen flex items-center justify-center p-4">
  <div class="grid-pattern"></div>
  <div class="vignette"></div>
  <div class="relative z-10 bg-white/[.08] backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl w-full max-w-[420px] p-9 fade-in">
    <div class="text-center mb-9">
      <div class="w-[72px] h-[72px] rounded-[20px] bg-gradient-to-br from-warm-400 to-warm-600 mx-auto mb-6 flex items-center justify-center shadow-xl shadow-warm-500/30 logo-mark login-logo">
        <svg class="scale-svg" style="width:42px;height:42px" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <!-- center post -->
          <line x1="24" y1="11" x2="24" y2="38"/>
          <!-- base -->
          <path d="M17 40 h14"/>
          <line x1="24" y1="38" x2="24" y2="40"/>
          <!-- top knob -->
          <circle cx="24" cy="9" r="2" fill="#fff" stroke="none"/>
          <g class="scale-beam">
            <!-- beam -->
            <line x1="9" y1="14" x2="39" y2="14"/>
            <!-- left strings + pan -->
            <g class="scale-string-l"><path d="M9 14 L5 24 M9 14 L13 24"/></g>

function getUnread(){return S.notifications.filter(n=>!n.read).length;}
function updateNotifBadge(){const c=getUnread(),el=document.getElementById('notifCount');if(c>0){el.textContent=c;el.classList.remove('hidden');}else el.classList.add('hidden');}
function toggleNotifs(){const p=document.getElementById('notifPanel');p.classList.toggle('open');if(p.classList.contains('open'))renderNotifPanel();}
function renderNotifPanel(){
  const p=document.getElementById('notifPanel');
  const icons={review:'📝',kudos:'🌟',meeting:'📅',goal:'🎯',feedback:'💬',pip:'⚠️'};
  p.innerHTML=`<div class="p-4 border-b border-ink-100 flex items-center justify-between"><h4 class="font-display font-semibold text-ink-700">Notifications</h4>${getUnread()>0?`<button onclick="S.notifications.forEach(n=>n.read=true);save();updateNotifBadge();renderNotifPanel();toast('All marked read','info')" class="text-xs text-brand-600 font-medium hover:underline">Mark all read</button>`:''}</div>
  <div class="max-h-[360px] overflow-y-auto">${S.notifications.length?S.notifications.map((n,i)=>`
    <button onclick="S.notifications[${i}].read=true;save();updateNotifBadge();go('${n.link}');toggleNotifs()" class="w-full text-left px-4 py-3 flex gap-3 items-start hover:bg-ink-50 transition border-b border-ink-50 ${n.read?'opacity-60':''}">
      <span class="text-lg flex-shrink-0 mt-0.5">${icons[n.type]||'📌'}</span>
      <div class="flex-1 min-w-0"><p class="text-sm text-ink-700 ${n.read?'':'font-semibold'}">${n.msg}</p><p class="text-[.65rem] text-ink-400 mt-0.5">${n.date}</p></div>

    </button>
  `).join(''):'<p class="p-4 text-sm text-ink-400">No notifications</p>'}</div>`;
}

function showNewCycleForm(){document.getElementById('newCycleForm').classList.toggle('hidden');}

function kudosCardHTML(k,ki){
  const reactions=k.reactions||{};

  return `<div class="kudos-card rounded-xl p-5">

        <div class="flex items-center gap-2 mt-3">

        </div>
      </div>
    </div>
  </div>`;
}
function sendKudos(){
  const to=document.getElementById('kTo').value,msg=document.getElementById('kMsg').value;
  if(!msg){toast('Write a message','error');return;}
  S.kudos.unshift({id:Date.now(),from:S.user?.name||'You',to,value:document.getElementById('kVal').value,msg,date:new Date().toISOString().slice(0,10),reactions:{}});

function reactKudos(ki,emoji){
  if(!S.kudos[ki].reactions)S.kudos[ki].reactions={};
  S.kudos[ki].reactions[emoji]=(S.kudos[ki].reactions[emoji]||0)+1;

}

PG.ninebox=()=>{const m=document.getElementById('main');

        <div class="flex items-center gap-2 text-xs text-ink-500"><div class="w-3 h-3 rounded bg-blue-50"></div>Core Players — develop, coach, invest</div>
        <div class="flex items-center gap-2 text-xs text-ink-500"><div class="w-3 h-3 rounded bg-amber-50"></div>Watch — targeted development</div>
        <div class="flex items-center gap-2 text-xs text-ink-500"><div class="w-3 h-3 rounded bg-red-50"></div>Underperformers — PIP or role change</div>
      </div>

  <div class="card"><h3 class="font-display font-semibold text-ink-700 mb-4">Distribution</h3><canvas id="nbChart" height="200"></canvas></div>

function showBoxDetail(row,col){
  const labels=[['Underperformer','Inconsistent Player','Rough Diamond'],['Effective Specialist','Core Player','High Potential'],['Solid Expert','Consistent Star','⭐ Star']];
  const actions=[['PIP, role reassignment, exit planning','Coaching on consistency, set clear milestones','Invest heavily — high potential but needs skill building'],['Retain in role, specialist track, knowledge transfer','Development plan, stretch projects, mentoring','Fast-track leadership program, high-visibility projects'],['Expert retention bonus, teaching role','Recognition, promotion track, management training','Top priority retention, succession candidate, exec mentoring']];
  const grid=Array.from({length:3},()=>Array.from({length:3},()=>[]));
  S.ninebox.forEach(n=>{const r=n.perf-1,c=n.pot-1;if(r>=0&&r<3&&c>=0&&c<3)grid[r][c].push(n);});
  const cell=grid[row][col];
  const el=document.getElementById('boxDetail');
  el.innerHTML=`<h3 class="font-display font-semibold text-ink-700 mb-1">${labels[row][col]}</h3>
    <p class="text-xs text-ink-400 mb-3">Perf: ${['Low','Medium','High'][row]} · Potential: ${['Low','Medium','High'][col]}</p>
    ${cell.length?`<div class="space-y-2 mb-4">${cell.map(n=>{const emp=S.employees.find(e=>e.name===n.name);return `<div class="flex items-center gap-2 p-2 bg-ink-50 rounded-lg"><div class="w-8 h-8 rounded-full bg-brand-200 flex items-center justify-center text-xs font-bold text-brand-800">${n.name[0]}</div><div><p class="text-sm font-medium text-ink-700">${n.name}</p><p class="text-[.65rem] text-ink-400">${emp?.dept||''} · ${rB(emp?.rating||0)}</p></div></div>`;}).join('')}</div>`:'<p class="text-sm text-ink-400 mb-4">No employees in this box.</p>'}
    <div class="bg-ink-50 rounded-lg p-3"><p class="text-xs text-ink-500"><strong>Recommended:</strong> ${actions[row][col]}</p></div>`;
}

const depts=Object.keys(dr),avgs=depts.map(d=>+(dr[d].reduce((a,b)=>a+b,0)/dr[d].length).toFixed(1));
